<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Shruthi Maa ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #2e0938 0%, #0c0214 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Star Particles */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Glassmorphism Main Card */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 182, 193, 0.3);
            border-radius: 28px;
            padding: 45px 35px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7),
                        0 0 50px rgba(236, 72, 153, 0.25);
            position: relative;
            z-index: 10;
        }

        .card-icon {
            font-size: 55px;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse-ring 2s infinite ease-in-out;
        }

        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.6)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 25px rgba(244, 63, 94, 0.9)); }
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #f472b6;
            font-size: 15px;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        /* Proposal Trigger Button */
        .proposal-btn {
            background: linear-gradient(135deg, #f43f5e 0%, #a855f7 100%);
            color: #ffffff;
            border: none;
            padding: 16px 36px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(244, 63, 94, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            outline: none;
        }

        .proposal-btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 15px 35px rgba(244, 63, 94, 0.8);
            background: linear-gradient(135deg, #fb7185 0%, #c084fc 100%);
        }

        .proposal-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Overlay Pop-up Modal */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 2, 20, 0.92);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 100;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: rgba(38, 14, 56, 0.95);
            border: 2px solid rgba(244, 63, 94, 0.5);
            border-radius: 32px;
            padding: 40px 30px;
            text-align: center;
            transform: scale(0.7);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 70px rgba(244, 63, 94, 0.6);
            max-width: 420px;
            width: 88%;
            position: relative;
        }

        .overlay.active .modal {
            transform: scale(1);
        }

        /* Proposal Animation Graphics */
        .proposal-animation {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            height: 125px;
            margin-bottom: 25px;
            position: relative;
        }

        .character {
            font-size: 65px;
            line-height: 1;
        }

        /* BRIGHT CUTE GIRL FACE AVATAR STYLING (LEFT SIDE) */
        .girl-avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 3px solid #ff79c6;
            box-shadow: 0 0 25px #ff79c6, 0 0 50px #ff2a85;
            object-fit: cover;
            opacity: 0;
            background: #fff;
        }

        .overlay.active .girl-avatar {
            animation: receiveGirl 0.8s forwards 0.2s ease-out, glowPulse 2s infinite ease-in-out 1s;
        }

        @keyframes receiveGirl {
            0% { transform: translateX(-40px) scale(0.8); opacity: 0; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px #ff79c6, 0 0 40px #ff2a85; }
            50% { box-shadow: 0 0 35px #ffb86c, 0 0 65px #ff2a85; }
        }

        /* Ring floating towards girl from right */
        .ring {
            font-size: 35px;
            position: absolute;
            right: 42%;
            bottom: 20px;
            opacity: 0;
        }

        .overlay.active .ring {
            animation: offerRing 1s forwards 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes offerRing {
            0% { transform: scale(0) translateY(20px); opacity: 0; }
            100% { transform: scale(1.3) translateY(-15px); opacity: 1; filter: drop-shadow(0 0 15px #fde047); }
        }

        /* Boy kneeling down animation (RIGHT SIDE) */
        .boy {
            transform: translateY(20px) rotate(10deg);
            opacity: 0;
        }

        .overlay.active .boy {
            animation: kneelRight 0.8s forwards 0.2s ease-out;
        }

        @keyframes kneelRight {
            0% { transform: translateX(40px) translateY(0); opacity: 0; }
            100% { transform: translateX(0) translateY(12px) rotate(15deg); opacity: 1; }
        }

        /* Message Styling */
        .message-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #f472b6 50%, #fb7185 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .btn-yes {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 25px rgba(34, 197, 94, 0.5);
        }

        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 30px rgba(34, 197, 94, 0.7);
        }

        /* UMMAA KISS POP-UP MODAL */
        .kiss-modal {
            background: rgba(50, 10, 40, 0.98);
            border: 3px solid #ff79c6;
            border-radius: 32px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 0 80px #ff2a85;
            max-width: 380px;
            width: 85%;
            position: relative;
            z-index: 120;
        }

        .kiss-emoji {
            font-size: 70px;
            margin-bottom: 10px;
            animation: bounceKiss 0.8s infinite alternate;
        }

        @keyframes bounceKiss {
            0% { transform: scale(1); }
            100% { transform: scale(1.3) rotate(10deg); filter: drop-shadow(0 0 20px #ff2a85); }
        }

        .kiss-text {
            font-size: 34px;
            font-weight: 900;
            color: #ff79c6;
            text-shadow: 0 0 20px #ff2a85;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .kiss-subtext {
            font-size: 20px;
            color: #fde047;
            font-weight: 700;
            margin-bottom: 25px;
        }

        /* Floating Hearts Canvas/Particles */
        .floating-heart {
            position: absolute;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 105;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.4) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Stars background -->
    <div class="stars" id="starsContainer"></div>

    <!-- Main Card -->
    <div class="card">
        <div class="card-icon">👑</div>
        <h1>Special Surprise</h1>
        <p class="subtitle">A message for Shruthi Maa</p>

        <button class="proposal-btn" onclick="openProposal()">
            <span>Reveal Secret</span> 💖
        </button>
    </div>

    <!-- Proposal Modal Pop-up -->
    <div class="overlay" id="proposalModal">
        <div class="modal">
            
            <!-- Girl on Left, Boy Proposing on Right -->
            <div class="proposal-animation">
                <img class="girl-avatar" src="https://api.iconify.design/noto:girl-light-skin-tone.svg?color=%23ffffff" alt="Shruthi Maa">
                <div class="ring">💍</div>
                <div class="character boy">🧎‍♂️</div>
            </div>

            <!-- Proposal Message -->
            <div class="message-title">I Love You<br>Shruthi Maa ❤️</div>

            <button class="btn-yes" onclick="showKiss()">Yes ❤️</button>
        </div>
    </div>

    <!-- Umma Kiss Pop-up Modal -->
    <div class="overlay" id="kissModal">
        <div class="kiss-modal">
            <div class="kiss-emoji">💋😘💋</div>
            <div class="kiss-text">Umma Umaaa Umaaa!</div>
            <div class="kiss-subtext">Love You So Much! ❤️✨</div>
            <button class="btn-yes" onclick="closeAll()">Close 💖</button>
        </div>
    </div>

    <script>
        // Generate Starry Background
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starsContainer.appendChild(star);
        }

        // Open Proposal Pop-up & Trigger Animations
        function openProposal() {
            document.getElementById('proposalModal').classList.add('active');
            triggerHeartRain();
        }

        // Show Kiss Pop-up when "Yes" is clicked
        function showKiss() {
            document.getElementById('proposalModal').classList.remove('active');
            document.getElementById('kissModal').classList.add('active');
            triggerKissRain();
        }

        // Close all modals
        function closeAll() {
            document.getElementById('kissModal').classList.remove('active');
        }

        // Generate Bright Floating Hearts & Sparkles
        function triggerHeartRain() {
            const symbols = ['💖', '💍', '🌸', '✨', '💕', '🌹', '💗', '⭐'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('floating-heart');
                    heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.bottom = '-50px';
                    heart.style.fontSize = (Math.random() * 22 + 20) + 'px';
                    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    document.body.appendChild(heart);

                    setTimeout(() => {
                        heart.remove();
                    }, 5000);
                }, i * 110);
            }
        }

        // Extra Burst of Kisses and Hearts on "Yes"
        function triggerKissRain() {
            const symbols = ['💋', '😘', '💖', '💕', '💋', '❤️', '✨'];
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const kiss = document.createElement('div');
                    kiss.classList.add('floating-heart');
                    kiss.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                    kiss.style.left = Math.random() * 100 + 'vw';
                    kiss.style.bottom = '-50px';
                    kiss.style.fontSize = (Math.random() * 25 + 22) + 'px';
                    kiss.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                    document.body.appendChild(kiss);

                    setTimeout(() => {
                        kiss.remove();
                    }, 5000);
                }, i * 90);
            }
        }
    </script>

</body>
</html>
